<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Courier+Prime:wght@400;700&family=Rajdhani:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #00ff88;
    --accent2: #00ccff;
    --bg: #0a0e0a;
    --panel: #0d1410;
    --border: #1a3020;
    --text: #c8e8c8;
    --dim: #4a7a5a;
    --display-bg: #050f08;
    --display-text: #00ff88;
    --btn-bg1: #142018;
    --btn-bg2: #0a120d;
    --btn-bg-h1: #1e3024;
    --btn-bg-h2: #121c16;
    --btn-bg-a1: #0a1210;
    --btn-bg-a2: #060e08;
    --input-bg: #060e08;
    --option-bg: #0a0e0a;
    --scanline: rgba(0,0,0,0.08);
    --font-display: 'VT323', monospace;
    --font-ui: 'Share Tech Mono', monospace;
    --grid-color: rgba(0,255,136,0.07);
    --grid-color2: rgba(0,255,136,0.03);
    --result-border: #0d1f10;
    --shadow-glow: rgba(0,255,136,0.08);
    --top-glow: rgba(0,255,136,0.1);
    --radius-panel: 0px;
    --radius-input: 0px;
    --radius-btn: 0px;
    --radius-display: 0px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
      linear-gradient(var(--grid-color2) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color2) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: var(--font-ui);
    transition: background-color 0.35s;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 440px;
  }

  .machine {
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: var(--radius-panel);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      0 0 30px var(--shadow-glow),
      inset 0 1px 0 var(--top-glow),
      4px 4px 0 #000;
    padding: 20px 20px 24px;
    position: relative;
    transition: background 0.35s, border-color 0.35s, border-radius 0.35s;
  }

  .machine::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius-panel) var(--radius-panel) 0 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .title {
    font-family: var(--font-display);
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 3px;
    transition: font-family 0.1s, color 0.35s;
  }

  .badge {
    font-family: var(--font-ui);
    font-size: 9px;
    color: var(--dim);
    text-align: right;
    line-height: 1.5;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: font-family 0.1s, color 0.35s;
  }

  /* ── DISPLAY BLOCK ── */
  .display-block {
    background: var(--display-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-display);
    padding: 14px 16px 12px;
    margin-bottom: 14px;
    position: relative;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
    transition: background 0.35s, border-radius 0.35s;
  }

  .display-label {
    font-family: var(--font-ui);
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
    transition: font-family 0.1s, color 0.35s;
  }

  /* Three equal rows in the display */
  .display-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--result-border);
  }
  .display-row:last-child { border-bottom: none; }

  .row-tag {
    font-family: var(--font-ui);
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    width: 36px;
    flex-shrink: 0;
    transition: font-family 0.1s, color 0.35s;
  }

  .row-val {
    font-family: var(--font-display);
    font-size: 42px;
    line-height: 1;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.35s, font-family 0.1s;
  }

  .row-unit {
    font-family: var(--font-display);
    font-size: 20px;
    white-space: nowrap;
    transition: color 0.35s, font-family 0.1s;
  }

  /* clear X button inside display */
  .display-clear {
    background: none;
    border: 1px solid transparent;
    border-radius: var(--radius-btn);
    color: var(--dim);
    font-family: var(--font-ui);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s, border-color 0.15s, border-radius 0.35s;
    -webkit-tap-highlight-color: transparent;
  }
  .display-clear:hover { color: #ff5050; border-color: rgba(255,80,80,0.4); }

  .input-row .row-val   { color: var(--display-text); }
  .input-row .row-unit  { color: var(--accent2); }
  .result-row .row-val  { color: var(--accent2); }
  .result-row .row-unit { color: var(--dim); }
  .scale-row .row-val   { color: var(--dim); font-size: 28px; }
  .scale-row .row-unit  { color: var(--dim); font-size: 14px; }

  .display-cursor {
    display: inline-block;
    width: 3px;
    height: 34px;
    background: var(--accent);
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    box-shadow: 0 0 8px var(--accent);
    transition: background 0.35s;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── CONTROLS ── */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .factor-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .ctrl-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .ctrl-label {
    font-family: var(--font-ui);
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: font-family 0.1s, color 0.35s;
  }

  select, input[type="number"] {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-bottom: 2px solid rgba(0,0,0,0.4);
    border-radius: var(--radius-input);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 15px;
    padding: 10px 12px;
    width: 100%;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: border-color 0.15s, background 0.35s, color 0.35s, border-radius 0.35s, font-family 0.1s;
  }

  select:focus, input:focus { border-color: var(--accent); }
  select option { background: var(--option-bg); }

  /* ── NUMPAD ── */
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .btn {
    background: linear-gradient(180deg, var(--btn-bg1) 0%, var(--btn-bg2) 100%);
    border: 1px solid var(--border);
    border-bottom: 3px solid rgba(0,0,0,0.5);
    border-radius: var(--radius-btn);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 18px;
    padding: 14px 8px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    transition: background 0.08s, color 0.08s, border-color 0.08s, border-radius 0.35s, font-family 0.1s;
    letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover {
    background: linear-gradient(180deg, var(--btn-bg-h1) 0%, var(--btn-bg-h2) 100%);
    color: var(--accent);
    border-color: var(--accent);
  }

  .btn:active, .btn.pressed {
    background: linear-gradient(180deg, var(--btn-bg-a1) 0%, var(--btn-bg-a2) 100%);
    border-bottom-width: 1px;
    transform: translateY(2px);
    color: var(--accent);
  }

  .btn.zero { grid-column: span 2; }
  .btn.action { color: var(--accent2); font-size: 15px; }

  .btn.backspace {
    color: #ff6060;
    border-color: rgba(255,60,60,0.2);
    font-size: 14px;
  }
  .btn.backspace:hover { color: #ff4040; border-color: #ff4040; }

  .btn.clear-btn {
    grid-column: span 3;
    color: #ff8844;
    border-color: rgba(255,136,68,0.2);
    font-size: 13px;
    padding: 10px;
    letter-spacing: 3px;
  }
  .btn.clear-btn:hover { color: #ff6622; border-color: #ff6622; }

  /* scanline */
  .machine::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius-panel);
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      var(--scanline) 2px, var(--scanline) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* ── THEME PANEL ── */
  .custom-panel {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-panel);
    box-shadow: 4px 4px 0 #000;
    transition: background 0.35s, border-radius 0.35s;
  }

  .custom-toggle {
    width: 100%;
    background: none;
    border: none;
    color: var(--dim);
    font-family: var(--font-ui);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.15s, font-family 0.1s;
  }
  .custom-toggle:hover { color: var(--text); }
  .custom-toggle .arrow { transition: transform 0.2s; display: inline-block; }
  .custom-toggle.open .arrow { transform: rotate(180deg); }

  .custom-body {
    display: none;
    padding: 14px;
    border-top: 1px solid var(--border);
    flex-direction: column;
    gap: 10px;
  }
  .custom-body.open { display: flex; }

  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .theme-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 6px;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-btn);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, border-radius 0.35s;
    -webkit-tap-highlight-color: transparent;
  }
  .theme-btn:hover { border-color: var(--accent); background: rgba(255,255,255,0.03); }
  .theme-btn.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .theme-swatch { display: flex; gap: 3px; align-items: center; }
  .swatch-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.3);
  }

  .theme-name {
    font-family: var(--font-ui);
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    transition: color 0.15s, font-family 0.1s;
  }
  .theme-btn:hover .theme-name,
  .theme-btn.active .theme-name { color: var(--text); }

  @media (max-width: 400px) {
    .row-val { font-size: 34px; }
    .btn { font-size: 16px; padding: 12px 6px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="machine">
    <div class="header">
      <div class="title" id="appTitle">SCALE CALC</div>
      <div class="badge" id="appBadge">UNIT CONVERTER<br>v1.0 — DRAW SCALE</div>
    </div>

    <!-- UNIFIED DISPLAY -->
    <div class="display-block">
      <div class="display-label">READOUT</div>

      <div class="display-row input-row">
        <div class="row-tag">IN</div>
        <div class="row-val" id="displayValue">0<span class="display-cursor" id="cursor"></span></div>
        <div class="row-unit" id="displayUnit">mm</div>
        <button class="display-clear" onclick="clearAll()" title="Clear">✕</button>
      </div>

      <div class="display-row result-row">
        <div class="row-tag">REAL</div>
        <div class="row-val" id="resultValue">0</div>
        <div class="row-unit" id="resultUnit">mm</div>
      </div>

      <div class="display-row scale-row">
        <div class="row-tag">SCALE</div>
        <div class="row-val" id="scaleDisplay">1:50</div>
        <div class="row-unit" id="scaleTypeDisplay">DRW→REAL</div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="ctrl-group">
        <div class="ctrl-label">INPUT UNIT</div>
        <select id="unitSelect" onchange="updateDisplay()">
          <option value="mm">mm — millimetre</option>
          <option value="cm">cm — centimetre</option>
          <option value="m">m — metre</option>
          <option value="in">in — inch</option>
          <option value="ft">ft — feet</option>
        </select>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">OUTPUT UNIT</div>
        <select id="outUnitSelect" onchange="updateDisplay()">
          <option value="mm">mm — millimetre</option>
          <option value="cm">cm — centimetre</option>
          <option value="m">m — metre</option>
          <option value="in">in — inch</option>
          <option value="ft">ft — feet</option>
        </select>
      </div>
    </div>

    <div class="factor-row">
      <div class="ctrl-group">
        <div class="ctrl-label">SCALE 1 :</div>
        <input type="number" id="scaleFactor" value="50" min="0.001" step="any" oninput="updateDisplay()" placeholder="e.g. 50">
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">SCALE TYPE</div>
        <select id="scaleType" onchange="updateDisplay()">
          <option value="drawing">Drawing → Real</option>
          <option value="real">Real → Drawing</option>
        </select>
      </div>
    </div>

    <!-- NUMPAD -->
    <div class="numpad">
      <button class="btn" onclick="numPress('7')">7</button>
      <button class="btn" onclick="numPress('8')">8</button>
      <button class="btn" onclick="numPress('9')">9</button>
      <button class="btn" onclick="numPress('4')">4</button>
      <button class="btn" onclick="numPress('5')">5</button>
      <button class="btn" onclick="numPress('6')">6</button>
      <button class="btn" onclick="numPress('1')">1</button>
      <button class="btn" onclick="numPress('2')">2</button>
      <button class="btn" onclick="numPress('3')">3</button>
      <button class="btn zero" onclick="numPress('0')">0</button>
      <button class="btn action" onclick="numPress('.')">•</button>
      <button class="btn zero" onclick="numPress('00')">00</button>
      <button class="btn backspace" onclick="backspace()">⌫ DEL</button>
      <button class="btn clear-btn" onclick="clearAll()">[ CLEAR ]</button>
    </div>
  </div>

  <!-- THEMES PANEL -->
  <div class="custom-panel">
    <button class="custom-toggle" id="customToggle" onclick="toggleCustom()">
      ▸ THEMES
      <span class="arrow">▾</span>
    </button>
    <div class="custom-body" id="customBody">
      <div class="theme-grid" id="themeGrid"></div>
    </div>
  </div>

</div>

      '--display-bg':'#020508','--display-text':'#00ff44',
      '--btn-bg1':'#081210','--btn-bg2':'#040c0a',
      '--btn-bg-h1':'#102018','--btn-bg-h2':'#0a1812',
      '--btn-bg-a1':'#040e0a','--btn-bg-a2':'#030a08',
      '--input-bg':'#020508','--option-bg':'#020608',
      '--scanline':'rgba(0,0,0,0.12)',
      '--result-border':'#081808',
      '--shadow-glow':'rgba(0,255,68,0.1)','--top-glow':'rgba(0,255,68,0.12)',
      '--grid-color':'rgba(0,255,68,0.08)','--grid-color2':'rgba(0,255,68,0.04)',
      '--font-display':"'Rajdhani', sans-serif",
      '--font-ui':"'Rajdhani', sans-serif",
      '--radius-panel':'6px','--radius-input':'6px',
      '--radius-btn':'4px','--radius-display':'6px',
    }
  },
  {
    id: 'slate',
    name: 'Slate',
    swatches: ['#1a1c20','#22252c','#e8c060'],
    vars: {
      '--accent':'#e8c060','--accent2':'#f0a030',
      '--bg':'#1a1c20','--panel':'#22252c','--border':'#363a44',
      '--text':'#d8d0b8','--dim':'#707060',
      '--display-bg':'#14161a','--display-text':'#e8c060',
      '--btn-bg1':'#282c34','--btn-bg2':'#1e2228',
      '--btn-bg-h1':'#343840','--btn-bg-h2':'#282c34',
      '--btn-bg-a1':'#1a1e24','--btn-bg-a2':'#14181e',
      '--input-bg':'#14161a','--option-bg':'#1a1c20',
      '--scanline':'rgba(0,0,0,0.06)',
      '--result-border':'#2a2820',
      '--shadow-glow':'rgba(232,192,96,0.06)','--top-glow':'rgba(232,192,96,0.08)',
      '--grid-color':'rgba(232,192,96,0.06)','--grid-color2':'rgba(232,192,96,0.025)',
      '--font-display':"'DM Mono', monospace",
      '--font-ui':"'DM Mono', monospace",
      '--radius-panel':'8px','--radius-input':'6px',
      '--radius-btn':'6px','--radius-display':'6px',
    }
  },
];

let activeTheme = 'phosphor';

function buildThemeGrid() {
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = '';
  themes.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (t.id === activeTheme ? ' active' : '');
    btn.onclick = () => applyTheme(t.id);
    btn.innerHTML = `
      <div class="theme-swatch">
        <div class="swatch-dot" style="background:${t.swatches[0]}"></div>
        <div class="swatch-dot" style="background:${t.swatches[1]}"></div>
        <div class="swatch-dot" style="background:${t.swatches[2]}"></div>
      </div>
      <div class="theme-name">${t.name}</div>
    `;
    grid.appendChild(btn);
  });
}

function applyTheme(id) {
  const t = themes.find(x => x.id === id);
  if (!t) return;
  activeTheme = id;
  const root = document.documentElement;
  Object.entries(t.vars).forEach(([k, v]) => root.style.setProperty(k, v));
  document.body.style.backgroundImage = `
    linear-gradient(${t.vars['--grid-color']} 1px, transparent 1px),
    linear-gradient(90deg, ${t.vars['--grid-color']} 1px, transparent 1px),
    linear-gradient(${t.vars['--grid-color2']} 1px, transparent 1px),
    linear-gradient(90deg, ${t.vars['--grid-color2']} 1px, transparent 1px)
  `;
  document.body.style.backgroundColor = t.vars['--bg'];
  document.querySelectorAll('.theme-btn').forEach((b, i) => {
    b.classList.toggle('active', themes[i].id === id);
  });
}

/* ═══════════════════════════════════════
   CALCULATOR
═══════════════════════════════════════ */
let current = '';
let hasDecimal = false;

const conversionToMM = { mm:1, cm:10, m:1000, in:25.4, ft:304.8 };

function numPress(char) {
  if (char === '00') {
    if (!current || current === '0') return;
    if (current.length >= 11) return;
    current += '00';
    if (current.length > 12) current = current.slice(0, 12);
  } else if (char === '.') {
    if (hasDecimal) return;
    hasDecimal = true;
    if (!current) current = '0';
    current += '.';
  } else {
    if (current === '0') current = char;
    else current += char;
    if (current.length > 12) return;
  }
  flashBtn(char);
  updateDisplay();
}

function backspace() {
  if (!current.length) return;
  if (current[current.length - 1] === '.') hasDecimal = false;
  current = current.slice(0, -1);
  updateDisplay();
}

function clearAll() {
  current = '';
  hasDecimal = false;
  const disp = document.getElementById('displayValue');
  disp.style.opacity = '0.15';
  setTimeout(() => disp.style.opacity = '1', 180);
  updateDisplay();
}

function flashBtn(char) {
  document.querySelectorAll('.btn').forEach(b => {
    const t = b.textContent.trim();
    if (t === char || (char === '.' && t === '•')) {
      b.classList.add('pressed');
      setTimeout(() => b.classList.remove('pressed'), 120);
    }
  });
}

function fmt(n) {
  if (n >= 1e9) return n.toExponential(2);
  if (n !== Math.floor(n)) return parseFloat(n.toFixed(4)).toString();
  return n.toString();
}

function updateDisplay() {
  const val = current || '0';
  const numVal = parseFloat(val) || 0;
  const inUnit  = document.getElementById('unitSelect').value;
  const outUnit = document.getElementById('outUnitSelect').value;
  const scale   = parseFloat(document.getElementById('scaleFactor').value) || 1;
  const scaleType = document.getElementById('scaleType').value;
  const labels  = { mm:'mm', cm:'cm', m:'m', in:'in', ft:'ft' };

  // Input row
  document.getElementById('displayUnit').textContent = labels[inUnit];
  document.getElementById('displayValue').innerHTML =
    val + '<span class="display-cursor" id="cursor"></span>';

  // Result row
  const mm = numVal * conversionToMM[inUnit];
  const realMM = scaleType === 'drawing' ? mm * scale : mm / scale;
  const result = realMM / conversionToMM[outUnit];
  document.getElementById('resultValue').textContent = fmt(result);
  document.getElementById('resultUnit').textContent = labels[outUnit];

  // Scale info row
  document.getElementById('scaleDisplay').textContent = `1:${scale}`;
  document.getElementById('scaleTypeDisplay').textContent =
    scaleType === 'drawing' ? 'DRW→REAL' : 'REAL→DRW';
}

document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') numPress(e.key);
  else if (e.key === '.') numPress('.');
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Delete' || e.key === 'Escape') clearAll();
});

function toggleCustom() {
  const body = document.getElementById('customBody');
  const btn  = document.getElementById('customToggle');
  const open = body.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.childNodes[0].textContent = open ? '▾ THEMES ' : '▸ THEMES ';
}

buildThemeGrid();
updateDisplay();
</script>
