<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Timber Frame Bent Designer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&display=swap');

  :root{
    --paper:#ece2cf;
    --paper2:#e3d6bd;
    --panel:#fbf7ee;
    --panel-line:#d9ccb0;
    --ink:#3a2c1a;
    --muted:#8a795c;
    --line:#bdac8c;
    --oak-1:#8a623094;
    --grain:#6c4c25;
    --edge:#54391c;
    --brass:#a06f2e;
    --brass-2:#c6913f;
    --accent:#9a5a2b;
    --shadow:rgba(58,42,20,.28);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 80% -10%, #f3ecdc 0%, transparent 55%),
      repeating-linear-gradient(0deg, rgba(120,95,55,.045) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(120,95,55,.045) 0 1px, transparent 1px 46px),
      linear-gradient(160deg, var(--paper) 0%, var(--paper2) 100%);
    display:flex;flex-direction:column;overflow:hidden;
  }

  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 20px;flex-wrap:wrap;
    border-bottom:1px solid var(--panel-line);
    background:linear-gradient(180deg, rgba(251,247,238,.85), rgba(251,247,238,.55));
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:baseline;gap:12px;min-width:0;}
  .brand h1{
    font-family:'Fraunces',Georgia,serif;font-weight:600;
    font-size:clamp(18px,2.4vw,26px);margin:0;letter-spacing:.2px;line-height:1;
  }
  .brand small{color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase;}

  .seg{display:flex;background:var(--panel);border:1px solid var(--panel-line);border-radius:11px;padding:3px;box-shadow:inset 0 1px 2px rgba(80,60,30,.08);}
  .seg button{
    font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);
    border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;
    transition:.16s;letter-spacing:.02em;
  }
  .seg button.on{background:linear-gradient(180deg,#5a3f1f,#3a2814);color:#f4e9d4;box-shadow:0 2px 6px rgba(58,42,20,.35);}

  .wrap{flex:1;display:flex;min-height:0;}
  .stage-wrap{flex:1;position:relative;min-width:0;}
  svg#stage{width:100%;height:100%;display:block;touch-action:none;}

  /* sidebar / controls */
  .panel{
    width:248px;flex-shrink:0;padding:18px;overflow-y:auto;
    border-left:1px solid var(--panel-line);
    background:linear-gradient(180deg, rgba(251,247,238,.72), rgba(248,242,230,.5));
  }
  .panel h2{font-family:'Fraunces',serif;font-weight:500;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;}
  .toggle{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 13px;margin-bottom:9px;border-radius:12px;cursor:pointer;
    background:var(--panel);border:1px solid var(--panel-line);transition:.16s;
  }
  .toggle:hover{border-color:var(--brass);}
  .toggle .lab{font-size:14px;font-weight:500;}
  .toggle .sub{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px;}
  .sw{width:42px;height:24px;border-radius:13px;background:#cdbf9f;position:relative;flex-shrink:0;transition:.18s;}
  .sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle.on .sw{background:linear-gradient(180deg,#b5832f,#8a5e22);}
  .toggle.on .sw::after{left:21px;}

  .readout{margin-top:18px;padding:13px;border-radius:12px;background:rgba(90,63,31,.06);border:1px dashed var(--line);}
  .readout .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .readout .row span:first-child{color:var(--muted);}
  .readout .row span:last-child{font-family:'Fraunces',serif;font-weight:500;font-variant-numeric:tabular-nums;}

  .btn-reset{
    margin-top:16px;width:100%;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.05em;
    padding:11px;border-radius:11px;cursor:pointer;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-line);transition:.16s;
  }
  .btn-reset:hover{background:#5a3f1f;color:#f4e9d4;border-color:#5a3f1f;}
  .btn-export{
    margin-top:9px;width:100%;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.05em;
    padding:11px;border-radius:11px;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,#b5832f,#8a5e22);border:1px solid #8a5e22;transition:.16s;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(138,94,34,.25);
  }
  .btn-export:hover{filter:brightness(1.08);}
  .btn-export:active{transform:scale(.98);}

  .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:12px;color:var(--muted);background:rgba(251,247,238,.8);padding:6px 14px;border-radius:20px;
    border:1px solid var(--panel-line);pointer-events:none;letter-spacing:.02em;white-space:nowrap;}

  /* modal numpad */
  .overlay{position:fixed;inset:0;background:rgba(40,28,14,.42);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .overlay.open{display:flex;}
  .modal{
    width:340px;max-width:100%;background:var(--panel);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px rgba(40,28,14,.4);border:1px solid var(--panel-line);
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
  .modal .mh{padding:16px 18px 4px;}
  .modal .mh .mt{font-family:'Fraunces',serif;font-weight:600;font-size:19px;}
  .modal .mh .ms{font-size:12px;color:var(--muted);margin-top:2px;}
  .disp{
    margin:10px 18px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid var(--panel-line);
    display:flex;align-items:baseline;justify-content:flex-end;gap:8px;min-height:56px;
  }
  .disp .val{font-family:'Fraunces',serif;font-weight:600;font-size:30px;font-variant-numeric:tabular-nums;color:var(--ink);}
  .disp .un{font-size:15px;color:var(--muted);font-weight:600;}
  .units{display:flex;gap:6px;padding:0 18px 10px;}
  .units button{flex:1;font-family:inherit;font-weight:600;font-size:13px;padding:8px 0;border-radius:9px;
    border:1px solid var(--panel-line);background:#fff;color:var(--muted);cursor:pointer;transition:.14s;}
  .units button.on{background:#5a3f1f;color:#f4e9d4;border-color:#5a3f1f;}
  .modes{display:flex;gap:6px;padding:0 18px 8px;}
  .modes button{flex:1;font-family:'Fraunces',serif;font-weight:500;font-size:14px;padding:9px 0;border-radius:10px;
    border:1px solid var(--panel-line);background:#fff;color:var(--muted);cursor:pointer;transition:.14s;letter-spacing:.02em;}
  .modes button.on{background:linear-gradient(180deg,#b5832f,#8a5e22);color:#fff;border-color:#8a5e22;box-shadow:0 2px 6px rgba(138,94,34,.3);}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px 14px;}
  .pad button{
    font-family:'Fraunces',serif;font-weight:500;font-size:24px;padding:16px 0;border-radius:13px;cursor:pointer;
    background:#fff;border:1px solid var(--panel-line);color:var(--ink);transition:.1s;user-select:none;
  }
  .pad button:active{transform:scale(.95);background:#f1e9d8;}
  .pad button.fn{font-family:'Archivo';font-size:15px;font-weight:600;color:var(--muted);}
  .mact{display:flex;gap:10px;padding:0 18px 18px;}
  .mact button{flex:1;font-family:inherit;font-weight:700;font-size:15px;padding:14px;border-radius:13px;cursor:pointer;border:0;letter-spacing:.03em;}
  .mact .cancel{background:#eadfca;color:var(--ink);}
  .mact .set{background:linear-gradient(180deg,#b5832f,#8a5e22);color:#fff;box-shadow:0 4px 12px rgba(138,94,34,.4);}

  .panel-toggle{display:none;}

  @media(max-width:760px){
    .wrap{flex-direction:column;}
    .panel{
      width:100%;order:2;display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;
      padding:12px;border-left:0;border-top:1px solid var(--panel-line);
      align-items:stretch;
    }
    .panel h2,.readout{display:none;}
    .toggle{margin-bottom:0;min-width:150px;flex-shrink:0;flex-direction:row;}
    .btn-reset,.btn-export{width:auto;margin-top:0;flex-shrink:0;padding:11px 18px;}
    .stage-wrap{order:1;}
    .hint{font-size:11px;bottom:8px;}
    header{padding:12px 14px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Timber Frame Bent Designer</h1>
  </div>
  <div class="seg" id="unitSeg">
    <button data-u="mm" class="on">mm</button>
    <button data-u="m">m</button>
    <button data-u="in">inch</button>
    <button data-u="ft">feet</button>
  </div>
</header>

<div class="wrap">
  <div class="stage-wrap">
    <svg id="stage" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="hint">Tap any timber to set its length</div>
  </div>

  <aside class="panel">
    <h2>Members</h2>
    <div class="toggle on" data-tog="king">
      <div><span class="lab">King post</span><span class="sub">with braces</span></div>
      <div class="sw"></div>
    </div>
    <div class="toggle" data-tog="queen">
      <div><span class="lab">Queen posts</span><span class="sub">paired struts to rafters</span></div>
      <div class="sw"></div>
    </div>
    <div class="toggle" data-tog="collar">
      <div><span class="lab">Collar</span><span class="sub">horizontal tie</span></div>
      <div class="sw"></div>
    </div>
    <div class="toggle on" data-tog="braces">
      <div><span class="lab">Knee braces</span><span class="sub">post to tie beam</span></div>
      <div class="sw"></div>
    </div>

    <div class="readout" id="readout"></div>
    <button class="btn-reset" id="reset">Reset frame</button>
    <button class="btn-export" id="exportPng">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export PNG</button>
  </aside>
</div>

<!-- numpad modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mh">
      <div class="mt" id="mTitle">Member</div>
      <div class="ms" id="mSub"></div>
    </div>
    <div class="disp"><span class="val" id="mVal">0</span><span class="un" id="mUn">mm</span></div>
    <div class="modes" id="mModes" style="display:none">
      <button data-mode="length" class="on">Length</button>
      <button data-mode="angle">Angle</button>
    </div>
    <div class="units" id="mUnits">
      <button data-u="mm">mm</button><button data-u="m">m</button>
      <button data-u="in">inch</button><button data-u="ft">feet</button>
    </div>
    <div class="pad" id="mPad">
      <button>7</button><button>8</button><button>9</button>
      <button>4</button><button>5</button><button>6</button>
      <button>1</button><button>2</button><button>3</button>
      <button class="fn" data-act="clr">X</button><button>0</button><button>.</button>
    </div>
    <div class="mact">
      <button class="cancel" id="mCancel">Cancel</button>
      <button class="set" id="mSet">Set length</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------- units ---------- */
const FAC = {mm:1, m:1000, in:25.4, ft:304.8};
const toMM = (v,u)=> v*FAC[u];
const round = (x,n)=> parseFloat(x.toFixed(n));
function valInUnit(mm,u){
  if(u==='mm') return Math.round(mm);
  if(u==='m')  return round(mm/1000,3);
  if(u==='in') return round(mm/25.4,2);
  return round(mm/304.8,2);
}
function fmt(mm,u){
  if(u==='mm') return Math.round(mm)+' mm';
  if(u==='m')  return round(mm/1000,3)+' m';
  if(u==='in') return round(mm/25.4,1)+' in';
  return round(mm/304.8,2)+' ft';
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- state ---------- */
const DEFAULTS = {span:6000, postHeight:2400, rafter:4200, brace:950, collarLen:2900, queenLen:1650};
let state = {
  unit:'mm',
  members:{...DEFAULTS},
  show:{king:true, queen:false, collar:false, braces:true}
};

/* member metadata */
const META = {
  post:   {name:'Post',             sub:'Vertical leg height',        wmm:200},
  span:   {name:'Tie beam',         sub:'Overall frame span',         wmm:225},
  rafter: {name:'Principal rafter',  sub:'Length or pitch angle',      wmm:175},
  king:   {name:'King post',        sub:'Height to apex (roof rise)', wmm:175},
  queen:  {name:'Queen post',       sub:'Length sets foot position',  wmm:145},
  collar: {name:'Collar',           sub:'Length sets its height',     wmm:155},
  brace:  {name:'Knee brace',       sub:'Diagonal run',               wmm:150}
};
const KINGBRACE_W = 115;

/* ---------- geometry ---------- */
function sanitize(){
  const m=state.members;
  m.span = clamp(m.span, 800, 30000);
  m.postHeight = clamp(m.postHeight, 400, 12000);
  m.rafter = clamp(m.rafter, m.span/2*1.04, 45000);
  let rise = Math.sqrt(m.rafter*m.rafter - (m.span/2)*(m.span/2));
  m.collarLen = clamp(m.collarLen, m.span*0.18, m.span*0.9);
  m.queenLen = clamp(m.queenLen, rise*0.18, rise*0.9);
  const maxRun = Math.min(m.postHeight, m.span/2)*0.92;
  m.brace = clamp(m.brace, 250, maxRun*Math.SQRT2);
}
function geom(){
  sanitize();
  const m=state.members, S=m.span, H=m.postHeight, R=m.rafter;
  const rise = Math.sqrt(R*R - (S/2)*(S/2));
  const apex=[S/2, H+rise];
  const g={S,H,R,rise,apex,
    postTopL:[0,H], postTopR:[S,H], baseL:[0,0], baseR:[S,0]};
  // knee braces
  const run = m.brace/Math.SQRT2;
  g.braceL=[[0,H-run],[run,H]];
  g.braceR=[[S,H-run],[S-run,H]];
  // collar
  const t = 1 - m.collarLen/S;
  const cy = H+rise*t;
  g.collar=[[t*S/2,cy],[S-t*S/2,cy]];
  // queen posts
  const qx = m.queenLen*(S/2)/rise;
  const qyTop = H + rise*(qx/(S/2));
  g.queenL=[[qx,H],[qx,qyTop]];
  g.queenR=[[S-qx,H],[S-qx,qyTop]];
  // king braces (to rafters)
  const kbBase=[S/2, H+rise*0.40];
  const tb=0.64;
  g.kbL=[kbBase,[tb*S/2, H+tb*rise]];
  g.kbR=[kbBase,[S-tb*S/2, H+tb*rise]];
  g.pitch = Math.atan(rise/(S/2))*180/Math.PI;
  return g;
}

/* ---------- view transform ---------- */
let TF={scale:1,ox:0,oy:0};
function fit(g){
  const W=1000,Hpx=720, padL=92,padR=64,padT=66,padB=92;
  const aw=W-padL-padR, ah=Hpx-padT-padB;
  const fw=g.S, fh=g.H+g.rise;
  const scale=Math.min(aw/fw, ah/fh);
  const ox=padL+(aw-fw*scale)/2;
  const oy=padT+ah; // pixel y for model y=0
  TF={scale,ox,oy};
}
const P=(x,y)=>({x:TF.ox+x*TF.scale, y:TF.oy-y*TF.scale});

/* ---------- drawing ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function timber(a,b,wmm,key,seed,curve,ref){
  const A=P(a[0],a[1]), B=P(b[0],b[1]);
  const dx=B.x-A.x, dy=B.y-A.y;
  const L=Math.hypot(dx,dy);
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  const w=clamp(wmm*TF.scale,9,72), hw=w/2, rx=Math.min(7,w*0.28);

  // bow direction (cosmetic curve) – bow AWAY from the reference point
  let bow=0;
  if(curve && ref){
    const R=P(ref[0],ref[1]);
    const aR=ang*Math.PI/180;
    const nx=-Math.sin(aR), ny=Math.cos(aR); // local +y in pixel space
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    const refDot=(R.x-mx)*nx+(R.y-my)*ny;
    bow = curve * L * (refDot>=0 ? 1 : -1);
  }

  const rnd=mulberry(seed);
  let grain='';
  const lines=Math.max(3,Math.round(w/5.5));
  for(let i=0;i<lines;i++){
    const gy=-hw*0.82 + (i+0.5)/lines*(w*0.82*2);
    const a1=gy+(rnd()-0.5)*2.5, mid=gy+(rnd()-0.5)*hw*0.35+bow, a3=gy+(rnd()-0.5)*2.5;
    grain+=`<path d="M6 ${a1.toFixed(1)} C ${(L*0.34).toFixed(0)} ${mid.toFixed(1)} ${(L*0.66).toFixed(0)} ${mid.toFixed(1)} ${(L-6).toFixed(0)} ${a3.toFixed(1)}" fill="none" stroke="var(--grain)" stroke-width="${(0.8+rnd()*0.7).toFixed(2)}" opacity="${(0.08+rnd()*0.13).toFixed(2)}"/>`;
  }
  const kAttr = key ? ` class="hit" data-key="${key}" style="cursor:pointer"` : ' style="pointer-events:none"';

  let fill, edge, hl;
  if(bow===0){
    fill=`<rect x="0" y="${-hw}" width="${L.toFixed(2)}" height="${w.toFixed(2)}" rx="${rx.toFixed(1)}" fill="url(#oak)"/>`;
    edge=`<rect x="0" y="${-hw}" width="${L.toFixed(2)}" height="${w.toFixed(2)}" rx="${rx.toFixed(1)}" fill="none" stroke="var(--edge)" stroke-width="1.4"/>`;
    hl  =`<rect x="3" y="${(-hw+1.5).toFixed(1)}" width="${(L-6).toFixed(1)}" height="${Math.max(2,w*0.13).toFixed(1)}" rx="2" fill="#fff" opacity="0.13"/>`;
  } else {
    const cx=(L/2).toFixed(2);
    const path=`M 0 ${-hw} Q ${cx} ${(bow-hw).toFixed(2)} ${L.toFixed(2)} ${-hw} L ${L.toFixed(2)} ${hw} Q ${cx} ${(bow+hw).toFixed(2)} 0 ${hw} Z`;
    fill=`<path d="${path}" fill="url(#oak)"/>`;
    edge=`<path d="${path}" fill="none" stroke="var(--edge)" stroke-width="1.4" stroke-linejoin="round"/>`;
    hl  =`<path d="M 3 ${(-hw+1.5).toFixed(1)} Q ${cx} ${(bow-hw+1.5).toFixed(1)} ${(L-3).toFixed(1)} ${(-hw+1.5).toFixed(1)}" fill="none" stroke="#fff" stroke-width="${Math.max(2,w*0.13).toFixed(1)}" opacity="0.13" stroke-linecap="round"/>`;
  }

  return `<g${kAttr} transform="translate(${A.x.toFixed(2)} ${A.y.toFixed(2)}) rotate(${ang.toFixed(3)})">
    ${fill}
    ${grain}
    ${hl}
    <rect x="0" y="${-hw}" width="6.5" height="${w.toFixed(1)}" rx="2" fill="#241404" opacity="0.13"/>
    <rect x="${(L-6.5).toFixed(1)}" y="${-hw}" width="6.5" height="${w.toFixed(1)}" rx="2" fill="#241404" opacity="0.13"/>
    ${edge}
  </g>`;
}
function peg(mx,my){
  const p=P(mx,my), r=clamp(TF.scale*78,3.4,8.5);
  return `<g pointer-events="none"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="url(#peg)" stroke="#2c1d0c" stroke-width="1"/><circle cx="${(p.x-r*0.28).toFixed(1)}" cy="${(p.y-r*0.28).toFixed(1)}" r="${(r*0.34).toFixed(1)}" fill="#8a652f" opacity=".7"/></g>`;
}
function label(mid,angDeg,text){
  const p=P(mid[0],mid[1]);
  let a=angDeg; if(a>90)a-=180; if(a<-90)a+=180;
  const w=text.length*6.7+14;
  return `<g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${a.toFixed(1)})" pointer-events="none">
    <rect x="${(-w/2).toFixed(1)}" y="-10" width="${w.toFixed(1)}" height="20" rx="10" fill="rgba(251,247,238,.86)" stroke="var(--line)" stroke-width=".7"/>
    <text x="0" y="4" text-anchor="middle" font-family="Fraunces,serif" font-size="12.5" font-weight="500" fill="var(--ink)">${text}</text>
  </g>`;
}
function angleOf(a,b){const A=P(a[0],a[1]),B=P(b[0],b[1]);return Math.atan2(B.y-A.y,B.x-A.x)*180/Math.PI;}
function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}

function dimension(a,b,off,text){
  // off in pixels, perpendicular (right-hand of a->b direction)
  const A=P(a[0],a[1]),B=P(b[0],b[1]);
  let dx=B.x-A.x,dy=B.y-A.y;const len=Math.hypot(dx,dy);const nx=-dy/len,ny=dx/len;
  const A2={x:A.x+nx*off,y:A.y+ny*off},B2={x:B.x+nx*off,y:B.y+ny*off};
  const m={x:(A2.x+B2.x)/2,y:(A2.y+B2.y)/2};
  let ang=Math.atan2(B2.y-A2.y,B2.x-A2.x)*180/Math.PI; if(ang>90)ang-=180;if(ang<-90)ang+=180;
  const tk=5; // tick half-len along normal
  const ext=`<line x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${(A2.x+nx*6).toFixed(1)}" y2="${(A2.y+ny*6).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
             <line x1="${B.x.toFixed(1)}" y1="${B.y.toFixed(1)}" x2="${(B2.x+nx*6).toFixed(1)}" y2="${(B2.y+ny*6).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  const main=`<line x1="${A2.x.toFixed(1)}" y1="${A2.y.toFixed(1)}" x2="${B2.x.toFixed(1)}" y2="${B2.y.toFixed(1)}" stroke="var(--brass)" stroke-width="1.2"/>`;
  const ux=dx/len,uy=dy/len;
  function tick(pt){return `<line x1="${(pt.x-(ux-nx)*tk).toFixed(1)}" y1="${(pt.y-(uy-ny)*tk).toFixed(1)}" x2="${(pt.x+(ux-nx)*tk).toFixed(1)}" y2="${(pt.y+(uy-ny)*tk).toFixed(1)}" stroke="var(--brass)" stroke-width="1.3"/>`;}
  const tw=text.length*6.5+12;
  const lab=`<g transform="translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${ang.toFixed(1)})"><rect x="${(-tw/2).toFixed(1)}" y="-9" width="${tw.toFixed(1)}" height="18" rx="4" fill="var(--paper)"/><text x="0" y="4" text-anchor="middle" font-family="Archivo" font-size="11.5" font-weight="600" letter-spacing=".03em" fill="var(--brass)">${text}</text></g>`;
  return `<g pointer-events="none">${ext}${main}${tick(A2)}${tick(B2)}${lab}</g>`;
}

/* ---------- render ---------- */
function pitchArc(g){
  const c = P(0, g.H);
  const r = 30;
  const ang = g.pitch * Math.PI/180;
  const ex = c.x + r*Math.cos(-ang);
  const ey = c.y + r*Math.sin(-ang);
  const midA = -ang/2;
  const lx = c.x + (r+18)*Math.cos(midA);
  const ly = c.y + (r+18)*Math.sin(midA);
  const txt = g.pitch.toFixed(1)+'°';
  const tw = txt.length*7.2 + 10;
  return `<g pointer-events="none">
    <path d="M ${(c.x+r).toFixed(1)} ${c.y.toFixed(1)} A ${r} ${r} 0 0 0 ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="var(--brass)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="${(c.x+r).toFixed(1)}" cy="${c.y.toFixed(1)}" r="1.8" fill="var(--brass)"/>
    <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="1.8" fill="var(--brass)"/>
    <rect x="${(lx-tw/2).toFixed(1)}" y="${(ly-10).toFixed(1)}" width="${tw.toFixed(1)}" height="20" rx="10" fill="rgba(251,247,238,.92)" stroke="var(--line)" stroke-width=".7"/>
    <text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-family="Fraunces,serif" font-size="13" font-weight="600" fill="var(--brass)">${txt}</text>
  </g>`;
}

function render(){
  const g=geom();
  fit(g);
  const m=state.members, U=state.unit, sh=state.show;
  let body='';

  // ground line
  const gl0=P(-g.S*0.06,0), gl1=P(g.S*1.06,0);
  body+=`<line x1="${gl0.x.toFixed(1)}" y1="${gl0.y.toFixed(1)}" x2="${gl1.x.toFixed(1)}" y2="${gl1.y.toFixed(1)}" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="2 5" pointer-events="none"/>`;

  // frame group (with shadow)
  let f='';
  // posts
  f+=timber(g.baseL,g.postTopL,META.post.wmm,'post',11);
  f+=timber(g.baseR,g.postTopR,META.post.wmm,'post',23);
  // tie beam
  f+=timber(g.postTopL,g.postTopR,META.span.wmm,'span',31);
  // rafters
  f+=timber(g.postTopL,g.apex,META.rafter.wmm,'rafter',41);
  f+=timber(g.postTopR,g.apex,META.rafter.wmm,'rafter',53);
  // collar
  if(sh.collar) f+=timber(g.collar[0],g.collar[1],META.collar.wmm,'collar',61);
  // king post + braces
  if(sh.king){
    f+=timber([g.S/2,g.H],g.apex,META.king.wmm,'king',71);
    f+=timber(g.kbL[0],g.kbL[1],KINGBRACE_W,null,72, 0.12, g.apex);
    f+=timber(g.kbR[0],g.kbR[1],KINGBRACE_W,null,73, 0.12, g.apex);
  }
  // queen posts
  if(sh.queen){
    f+=timber(g.queenL[0],g.queenL[1],META.queen.wmm,'queen',81);
    f+=timber(g.queenR[0],g.queenR[1],META.queen.wmm,'queen',83);
  }
  // knee braces
  if(sh.braces){
    f+=timber(g.braceL[0],g.braceL[1],META.brace.wmm,'brace',91, 0.14, g.postTopL);
    f+=timber(g.braceR[0],g.braceR[1],META.brace.wmm,'brace',93, 0.14, g.postTopR);
  }

  // pegs
  let pegs='';
  pegs+=peg(0,g.H)+peg(g.S,g.H);              // post/tie/rafter feet
  pegs+=peg(g.apex[0],g.apex[1]);             // apex
  if(sh.braces){pegs+=peg(...g.braceL[0])+peg(...g.braceL[1])+peg(...g.braceR[0])+peg(...g.braceR[1]);}
  if(sh.collar){pegs+=peg(...g.collar[0])+peg(...g.collar[1]);}
  if(sh.king){pegs+=peg(g.S/2,g.H);}
  if(sh.queen){pegs+=peg(...g.queenL[0])+peg(...g.queenL[1])+peg(...g.queenR[0])+peg(...g.queenR[1]);}
  f+=pegs;

  body+=`<g filter="url(#fsh)">${f}</g>`;

  // labels
  let labs='';
  labs+=label(mid(g.baseL,g.postTopL), angleOf(g.baseL,g.postTopL), fmt(g.H,U));
  labs+=label(mid(g.postTopL,g.postTopR), 0, fmt(g.S,U));
  labs+=label(mid(g.postTopL,g.apex), angleOf(g.postTopL,g.apex), fmt(g.R,U));
  labs+=label(mid(g.postTopR,g.apex), angleOf(g.postTopR,g.apex), fmt(g.R,U));
  if(sh.king) labs+=label(mid([g.S/2,g.H],g.apex), 90, fmt(g.rise,U));
  if(sh.collar) labs+=label(mid(g.collar[0],g.collar[1]),0,fmt(m.collarLen,U));
  if(sh.braces) labs+=label(mid(g.braceL[0],g.braceL[1]),angleOf(g.braceL[0],g.braceL[1]),fmt(m.brace,U));
  if(sh.queen) labs+=label(mid(g.queenL[0],g.queenL[1]),90,fmt(m.queenLen,U));
  body+=labs;

  // pitch angle indicator at left rafter foot
  body+=pitchArc(g);

  stage.innerHTML = DEFS + body;

  // readout
  readout.innerHTML =
    row('Width', fmt(g.S,U)) +
    row('Post height', fmt(g.H,U)) +
    row('Total height', fmt(g.H + g.rise,U)) +
    row('Principal rafter length', fmt(g.R,U)) +
    row('Roof pitch', g.pitch.toFixed(1)+'\u00B0');
}
const row=(a,b)=>`<div class="row"><span>${a}</span><span>${b}</span></div>`;

const DEFS=`<defs>
  <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a6233"/>
    <stop offset="0.14" stop-color="#b78a4f"/>
    <stop offset="0.42" stop-color="#d8b27d"/>
    <stop offset="0.58" stop-color="#d3ab73"/>
    <stop offset="0.85" stop-color="#a87b42"/>
    <stop offset="1" stop-color="#7c562c"/>
  </linearGradient>
  <radialGradient id="peg" cx="0.4" cy="0.35" r="0.8">
    <stop offset="0" stop-color="#6e4c22"/>
    <stop offset="1" stop-color="#3c280f"/>
  </radialGradient>
  <filter id="fsh" x="-12%" y="-12%" width="124%" height="130%">
    <feDropShadow dx="0" dy="7" stdDev="7" flood-color="#3a2a14" flood-opacity="0.26"/>
  </filter>
</defs>`;

/* ---------- DOM refs ---------- */
const stage=document.getElementById('stage');
const readout=document.getElementById('readout');
const overlay=document.getElementById('overlay');

/* ---------- unit segmented ---------- */
document.getElementById('unitSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  state.unit=b.dataset.u; render();
});

/* ---------- toggles ---------- */
document.querySelectorAll('.toggle').forEach(t=>{
  t.addEventListener('click',()=>{
    const k=t.dataset.tog;
    state.show[k]=!state.show[k];
    t.classList.toggle('on',state.show[k]);
    render();
  });
});

/* ---------- reset ---------- */
document.getElementById('reset').addEventListener('click',()=>{
  state.members={...DEFAULTS};
  state.show={king:true,queen:false,collar:false,braces:true};
  document.querySelectorAll('.toggle').forEach(t=>t.classList.toggle('on',state.show[t.dataset.tog]));
  render();
});

/* ---------- PNG export ---------- */
document.getElementById('exportPng').addEventListener('click',exportPNG);
function exportPNG(){
  const btn=document.getElementById('exportPng');
  const orig=btn.innerHTML;
  btn.innerHTML='Rendering…'; btn.disabled=true;

  // clone the live SVG so we don't disturb the DOM
  const svg=stage.cloneNode(true);
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  svg.setAttribute('width','1000');
  svg.setAttribute('height','720');

  // resolve CSS variables to literal colors (var(--x) won't resolve in a standalone SVG image)
  const cs=getComputedStyle(document.documentElement);
  const vars=['--paper','--paper2','--panel','--panel-line','--ink','--muted','--line','--grain','--edge','--brass','--brass-2','--accent'];
  let html=new XMLSerializer().serializeToString(svg);
  vars.forEach(v=>{
    const val=cs.getPropertyValue(v).trim();
    if(val) html=html.split('var('+v+')').join(val);
  });

  // paint paper background behind the frame
  const paper=cs.getPropertyValue('--paper').trim()||'#ece2cf';
  html=html.replace(/(<svg[^>]*>)/, `$1<rect width="1000" height="720" fill="${paper}"/>`);

  const blob=new Blob([html],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const scale=3; // crisp output
    const W=1000*scale, H=720*scale;
    const canvas=document.createElement('canvas');
    canvas.width=W; canvas.height=H;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle=paper;
    ctx.fillRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    URL.revokeObjectURL(url);
    canvas.toBlob(out=>{
      if(!out){restore();return;}
      const a=document.createElement('a');
      const u=URL.createObjectURL(out);
      a.href=u; a.download='timber-frame-bent.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),1500);
      restore();
    },'image/png');
  };
  img.onerror=()=>{URL.revokeObjectURL(url);restore();alert('PNG export failed.');};
  img.src=url;
  function restore(){btn.innerHTML=orig; btn.disabled=false;}
}

/* ---------- member click -> editor ---------- */
stage.addEventListener('click',e=>{
  const g=e.target.closest('g[data-key]'); if(!g)return;
  openEditor(g.dataset.key);
});

/* ---------- numpad editor ---------- */
let edit=null;
function currentMM(key){
  const m=state.members, gm=geom();
  switch(key){
    case 'post':return m.postHeight;
    case 'span':return m.span;
    case 'rafter':return m.rafter;
    case 'king':return gm.rise;
    case 'queen':return m.queenLen;
    case 'collar':return m.collarLen;
    case 'brace':return m.brace;
  }
}
function openEditor(key){
  const mm=currentMM(key);
  edit={key, unit:state.unit, str:String(valInUnit(mm,state.unit)), fresh:true, mode:'length'};
  document.getElementById('mTitle').textContent=META[key].name;
  document.getElementById('mSub').textContent=META[key].sub;
  const modes=document.getElementById('mModes');
  if(key==='rafter'){
    modes.style.display='flex';
    document.querySelectorAll('#mModes button').forEach(b=>b.classList.toggle('on',b.dataset.mode==='length'));
    document.getElementById('mUnits').style.display='flex';
  } else {
    modes.style.display='none';
    document.getElementById('mUnits').style.display='flex';
  }
  syncUnitsUI(); updateDisp();
  overlay.classList.add('open');
}
function closeEditor(){overlay.classList.remove('open');edit=null;}
function syncUnitsUI(){
  document.querySelectorAll('#mUnits button').forEach(b=>b.classList.toggle('on',b.dataset.u===edit.unit));
  updateUnitLabel();
}
function updateUnitLabel(){
  const un=document.getElementById('mUn');
  if(edit && edit.mode==='angle') un.textContent='°';
  else un.textContent = edit.unit==='in'?'in':edit.unit==='ft'?'ft':edit.unit;
}
function updateDisp(){document.getElementById('mVal').textContent = edit.str===''?'0':edit.str;}

document.getElementById('mPad').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!edit)return;
  if(b.dataset.act==='clr'){edit.str='';edit.fresh=false;updateDisp();return;}
  press(b.textContent);
});
function press(ch){
  if(!edit)return;
  if(edit.fresh){edit.str=''; edit.fresh=false;}
  if(ch==='.'){ if(!edit.str.includes('.')) edit.str=(edit.str===''?'0':edit.str)+'.'; }
  else { edit.str+=ch; }
  if(edit.str.length>9)edit.str=edit.str.slice(0,9);
  updateDisp();
}
document.getElementById('mUnits').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!edit||edit.mode==='angle')return;
  const mm=toMM(parseFloat(edit.str||'0')||0, edit.unit);
  edit.unit=b.dataset.u;
  edit.str=String(valInUnit(mm,edit.unit));
  edit.fresh=true;
  syncUnitsUI(); updateDisp();
});
document.getElementById('mModes').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!edit)return;
  if(edit.mode===b.dataset.mode)return;
  const oldMode=edit.mode;
  edit.mode=b.dataset.mode;
  document.querySelectorAll('#mModes button').forEach(x=>x.classList.toggle('on',x===b));
  const half=state.members.span/2;
  if(edit.mode==='angle'){
    // convert current length string to angle
    const mm=toMM(parseFloat(edit.str||'0')||0, edit.unit);
    const r=Math.max(mm, half*1.04);
    const ang=Math.acos(half/r)*180/Math.PI;
    edit.str=String(round(ang,1));
    document.getElementById('mUnits').style.display='none';
  } else {
    // convert current angle string to rafter length
    const ang=clamp(parseFloat(edit.str||'0')||0, 1, 85);
    const r=half/Math.cos(ang*Math.PI/180);
    edit.str=String(valInUnit(r, edit.unit));
    document.getElementById('mUnits').style.display='flex';
  }
  edit.fresh=true;
  updateUnitLabel(); updateDisp();
});
document.getElementById('mCancel').addEventListener('click',closeEditor);
document.getElementById('mSet').addEventListener('click',commit);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeEditor();});

function commit(){
  if(!edit)return;
  const v=parseFloat(edit.str);
  if(isNaN(v)||v<=0){closeEditor();return;}
  if(edit.key==='rafter' && edit.mode==='angle'){
    const ang=clamp(v, 1, 85);
    const half=state.members.span/2;
    state.members.rafter = half/Math.cos(ang*Math.PI/180);
  } else {
    const mm=toMM(v,edit.unit);
    applyValue(edit.key,mm);
  }
  closeEditor(); render();
}
function applyValue(key,mm){
  const m=state.members;
  switch(key){
    case 'post':m.postHeight=mm;break;
    case 'span':
      m.span=mm;
      if(m.rafter < m.span/2*1.04) m.rafter=m.span/2*1.18;
      break;
    case 'rafter':m.rafter=mm;break;
    case 'king':{ // mm = desired rise
      const half=m.span/2;
      m.rafter=Math.sqrt(mm*mm+half*half);
      break;}
    case 'queen':m.queenLen=mm;break;
    case 'collar':m.collarLen=mm;break;
    case 'brace':m.brace=mm;break;
  }
}

/* physical keyboard incl. numpad */
window.addEventListener('keydown',e=>{
  if(!edit)return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='.'||e.key===',')press('.');
  else if(e.key==='Backspace'){edit.fresh=false; edit.str=edit.str.slice(0,-1);updateDisp();}
  else if(e.key==='Enter')commit();
  else if(e.key==='Escape')closeEditor();
});

/* re-fit on resize */
window.addEventListener('resize',render);

render();
</script>
</body>
</html>
