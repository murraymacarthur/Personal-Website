<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>π Irrational Pendulum</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700&display=swap');

  :root {
    --bg: #070709;
    --panel: #0d0d12;
    --border: rgba(255,255,255,0.07);
    --accent: #c8a97e;
    --accent2: #7eb8c8;
    --accent3: #c87ea0;
    --text: #e8e4dc;
    --dim: rgba(232,228,220,0.4);
    --glow: rgba(200,169,126,0.15);
    --header-h: 52px;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
  }

  body { display: flex; flex-direction: column; }

  /* ── Header ── */
  header {
    height: var(--header-h);
    min-height: var(--header-h);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--accent);
  }

  header .sub {
    font-size: 0.6rem;
    color: var(--dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  header .eq {
    margin-left: auto;
    font-size: 0.65rem;
    color: var(--accent2);
    opacity: 0.7;
    font-style: italic;
  }

  /* ── Main row ── */
  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }

  /* ── Canvas wrapper ── */
  .canvas-wrap {
    flex: 1;
    position: relative;
    min-width: 0;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  /* ── Zoom buttons ── */
  .zoom-btns {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 20;
  }

  .zoom-btns button {
    width: 34px;
    height: 34px;
    background: rgba(13,13,18,0.85);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--dim);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    flex: none;
    padding: 0;
    letter-spacing: 0;
    text-transform: none;
  }

  .zoom-btns button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(200,169,126,0.12);
  }

  .zoom-label {
    text-align: center;
    font-size: 0.5rem;
    color: var(--dim);
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* ── Side panel ── */
  .panel {
    width: 240px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel::-webkit-scrollbar { width: 3px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .section-label {
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 5px;
  }

  .control-group { display: flex; flex-direction: column; gap: 11px; }
  .control { display: flex; flex-direction: column; gap: 5px; }

  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 0.6rem;
    color: var(--dim);
  }

  .control label span { color: var(--accent); font-weight: 700; }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 1px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--glow);
    cursor: pointer;
    transition: transform 0.15s;
  }

  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  .btn-row { display: flex; gap: 7px; flex-wrap: wrap; }

  button {
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: all 0.18s;
    flex: 1;
  }

  button:hover { border-color: var(--accent); color: var(--accent); background: var(--glow); }
  button.active { border-color: var(--accent); color: var(--accent); background: rgba(200,169,126,0.1); }
  button.danger:hover { border-color: var(--accent3); color: var(--accent3); background: rgba(200,126,160,0.1); }

  .color-row { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; }

  .swatch {
    width: 100%; aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .swatch:hover, .swatch.active { transform: scale(1.2); border-color: white; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

  .stat {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px;
  }

  .stat .val { font-size: 0.85rem; color: var(--accent2); font-weight: 700; display: block; }
  .stat .lbl { font-size: 0.5rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }

  /* ── Panel toggle tab ── */
  .toggle-panel-btn {
    position: absolute;
    top: 50%;
    left: -22px;
    transform: translateY(-50%);
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--border);
    border-right: none;
    color: var(--dim);
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    padding: 8px 4px;
    cursor: pointer;
    writing-mode: vertical-rl;
    letter-spacing: 0.1em;
    border-radius: 3px 0 0 3px;
    transition: all 0.2s;
    width: 22px;
    flex: none;
    text-transform: uppercase;
  }

  .toggle-panel-btn:hover { color: var(--accent); border-color: var(--accent); }

  .panel-wrap {
    position: relative;
    display: flex;
    flex-shrink: 0;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 28px;
    left: calc(50% - 120px);
    background: rgba(200,169,126,0.13);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 7px 18px;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 4px;
    pointer-events: none;
    z-index: 99;
    opacity: 0;
    transition: opacity 0.4s;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>π Pendulum</h1>
  <span class="sub">Irrational Orbit Tracer</span>
  <span class="eq">z(θ) = θ · i^π</span>
</header>

<div class="main">
  <div class="canvas-wrap">
    <canvas id="c"></canvas>

    <!-- Zoom controls -->
    <div class="zoom-btns">
      <button id="btn-zoom-in" title="Zoom In">+</button>
      <button id="btn-zoom-out" title="Zoom Out">−</button>
      <button id="btn-zoom-reset" title="Reset Zoom" style="font-size:0.5rem;height:28px;">RST</button>
      <div class="zoom-label" id="zoom-label">100%</div>
    </div>
  </div>

  <div class="panel-wrap">
    <button class="toggle-panel-btn" id="toggle-panel">Controls</button>
    <aside class="panel" id="panel">

      <div>
        <div class="section-label">Pendulum</div>
        <div class="control-group">
          <div class="control">
            <label>Arms <span id="v-arms">3</span></label>
            <input type="range" id="r-arms" min="1" max="6" step="1" value="3">
          </div>
          <div class="control">
            <label>Speed <span id="v-speed">1.0</span>×</label>
            <input type="range" id="r-speed" min="0.1" max="4" step="0.05" value="1">
          </div>
          <div class="control">
            <label>Length Ratio <span id="v-ratio">π</span></label>
            <input type="range" id="r-ratio" min="1.1" max="6" step="0.001" value="3.14159">
          </div>
          <div class="control">
            <label>Phase Offset <span id="v-phase">0°</span></label>
            <input type="range" id="r-phase" min="0" max="360" step="1" value="0">
          </div>
          <div class="control">
            <label>Arm Scale <span id="v-scale">0.85</span></label>
            <input type="range" id="r-scale" min="0.3" max="0.98" step="0.01" value="0.85">
          </div>
        </div>
      </div>

      <div>
        <div class="section-label">Trail</div>
        <div class="control-group">
          <div class="control">
            <label>Trail Length <span id="v-trail">2000</span></label>
            <input type="range" id="r-trail" min="50" max="8000" step="50" value="2000">
          </div>
          <div class="control">
            <label>Fade <span id="v-fade">0.012</span></label>
            <input type="range" id="r-fade" min="0.001" max="0.08" step="0.001" value="0.012">
          </div>
          <div class="control">
            <label>Line Width <span id="v-lw">1.5</span></label>
            <input type="range" id="r-lw" min="0.5" max="6" step="0.1" value="1.5">
          </div>
        </div>
      </div>

      <div>
        <div class="section-label">Colour</div>
        <div class="color-row">
          <div class="swatch active" data-palette="0" style="background:linear-gradient(135deg,#c8a97e,#7eb8c8)" title="Amber & Teal"></div>
          <div class="swatch" data-palette="1" style="background:linear-gradient(135deg,#fff,#aaa)" title="Pure White"></div>
          <div class="swatch" data-palette="2" style="background:linear-gradient(135deg,#7eb8c8,#c87ea0)" title="Neon Ice"></div>
          <div class="swatch" data-palette="3" style="background:linear-gradient(135deg,#a0ff88,#00ffcc)" title="Acid Green"></div>
          <div class="swatch" data-palette="4" style="background:linear-gradient(135deg,#ff8860,#ffdd44)" title="Sunset"></div>
        </div>
        <div style="margin-top:10px" class="control">
          <label>Opacity <span id="v-alpha">0.9</span></label>
          <input type="range" id="r-alpha" min="0.05" max="1" step="0.01" value="0.9">
        </div>
        <div style="margin-top:10px" class="control">
          <label>Glow <span id="v-glow">6</span>px</label>
          <input type="range" id="r-glow" min="0" max="30" step="1" value="6">
        </div>
      </div>

      <div>
        <div class="section-label">Extras</div>
        <div class="btn-row">
          <button id="btn-arms" class="active">Show Arms</button>
          <button id="btn-dots">Show Dots</button>
        </div>
        <div class="btn-row" style="margin-top:7px">
          <button id="btn-rainbow">Rainbow</button>
          <button id="btn-mirror">Mirror</button>
        </div>
        <div class="btn-row" style="margin-top:7px">
          <button id="btn-ghost">Ghost Trail</button>
          <button id="btn-burst">Burst!</button>
        </div>
      </div>

      <div>
        <div class="section-label">Presets</div>
        <div class="btn-row">
          <button data-preset="pi">π Classic</button>
          <button data-preset="phi">φ Gold</button>
        </div>
        <div class="btn-row" style="margin-top:7px">
          <button data-preset="e">e Euler</button>
          <button data-preset="chaos">Chaos</button>
        </div>
      </div>

      <div>
        <div class="section-label">Stats</div>
        <div class="stat-grid">
          <div class="stat"><span class="val" id="s-pts">0</span><span class="lbl">Trail pts</span></div>
          <div class="stat"><span class="val" id="s-rev">0</span><span class="lbl">Revolutions</span></div>
          <div class="stat"><span class="val" id="s-fps">0</span><span class="lbl">FPS</span></div>
          <div class="stat"><span class="val" id="s-ratio">π</span><span class="lbl">Ratio</span></div>
        </div>
      </div>

      <div class="btn-row">
        <button id="btn-pause">Pause</button>
        <button id="btn-clear" class="danger">Clear</button>
      </div>
      <div class="btn-row">
        <button id="btn-save">Save PNG</button>
      </div>

    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Canvas setup with DPR scaling ────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = canvas.parentElement;
let dpr = window.devicePixelRatio || 1;

function resize() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  // Physical pixels
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  // CSS size
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  // Scale all drawing ops
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Logical dimensions used in math
  CW = w;
  CH = h;
  trail = [];
  ghostFrames = [];
  ctx.fillStyle = '#070709';
  ctx.fillRect(0, 0, CW, CH);
}

let CW = 0, CH = 0;

// ── State ────────────────────────────────────────────────────────────────────
let params = {
  arms: 3,
  speed: 1.0,
  ratio: Math.PI,
  phase: 0,
  scale: 0.85,
  trailLen: 2000,
  fade: 0.012,
  lw: 1.5,
  alpha: 0.9,
  glow: 6,
  palette: 0,
  showArms: true,
  showDots: false,
  rainbow: false,
  mirror: false,
  ghost: false,
};

let zoom = 1.0;
let paused = false;
let t = 0;
let trail = [];        // {x,y,t,hue}
let revolutions = 0;
let prevAngle = 0;
let fpsArr = [];
let lastFpsTs = performance.now();
let burstActive = false;
let burstT = 0;
let ghostFrames = [];
let hue = 0;

const PALETTES = [
  t => `hsla(${38  + Math.sin(t * 0.3) * 20},55%,65%,`,
  t => `hsla(0,0%,${90 + Math.sin(t * 0.5) * 8}%,`,
  t => `hsla(${190 + Math.sin(t * 0.4) * 40},65%,65%,`,
  t => `hsla(${130 + Math.sin(t * 0.2) * 30},80%,65%,`,
  t => `hsla(${15  + Math.sin(t * 0.35)*20},90%,65%,`,
];

// ── Pendulum math ─────────────────────────────────────────────────────────────
function getPendulumPos(time) {
  const cx = CW / 2;
  const cy = CH / 2;
  const maxR = Math.min(CW, CH) * 0.42 * zoom;

  let x = cx, y = cy;
  let r = maxR;
  const armPositions = [[cx, cy]];

  for (let i = 0; i < params.arms; i++) {
    const freq  = Math.pow(params.ratio, i);
    const angle = freq * time + (params.phase * Math.PI / 180) * (i + 1);
    x += r * Math.cos(angle);
    y += r * Math.sin(angle);
    armPositions.push([x, y]);
    r *= params.scale;
  }
  return { x, y, armPositions };
}

// ── Draw loop ─────────────────────────────────────────────────────────────────
function draw(ts) {
  requestAnimationFrame(draw);

  // FPS
  fpsArr.push(ts - lastFpsTs);
  if (fpsArr.length > 40) fpsArr.shift();
  lastFpsTs = ts;
  const fps = Math.round(1000 / (fpsArr.reduce((a,b)=>a+b,0)/fpsArr.length));

  if (!paused) {
    t   += 0.008 * params.speed * (burstActive ? 3 : 1);
    hue  = (hue + 0.35) % 360;
    if (burstActive) { burstT++; if (burstT > 120) { burstActive = false; burstT = 0; } }
  }

  const { x, y, armPositions } = getPendulumPos(t);

  // Revolution counter
  const curAngle = Math.atan2(y - CH/2, x - CW/2);
  const delta    = curAngle - prevAngle;
  if (Math.abs(delta) > Math.PI) revolutions += Math.sign(delta) * -1;
  prevAngle = curAngle;

  // Store trail point
  if (!paused) {
    trail.push({ x, y, t, hue });
    if (trail.length > params.trailLen) trail.shift();
  }

  // Ghost snapshot
  if (params.ghost && !paused && trail.length % 300 === 0) {
    ghostFrames.push(trail.map(p => ({...p})));
    if (ghostFrames.length > 4) ghostFrames.shift();
  }

  // ── Fade overlay ──────────────────────────────────────────────────────────
  ctx.fillStyle = `rgba(7,7,9,${params.fade * 10})`;
  ctx.fillRect(0, 0, CW, CH);

  // ── Ghost trails ──────────────────────────────────────────────────────────
  if (params.ghost) {
    ghostFrames.forEach((frame, gi) => {
      drawTrail(frame, 0.06 + gi * 0.03, true);
    });
  }

  // ── Main trail ────────────────────────────────────────────────────────────
  drawTrail(trail, params.alpha, false);

  // ── Mirror ────────────────────────────────────────────────────────────────
  if (params.mirror) {
    ctx.save();
    ctx.translate(CW, 0);
    ctx.scale(-1, 1);
    drawTrail(trail, params.alpha * 0.45, false);
    ctx.restore();
  }

  // ── Arms ──────────────────────────────────────────────────────────────────
  if (params.showArms) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 0.8;
    ctx.setLineDash([3, 5]);
    for (let i = 0; i < armPositions.length - 1; i++) {
      ctx.beginPath();
      ctx.moveTo(armPositions[i][0], armPositions[i][1]);
      ctx.lineTo(armPositions[i+1][0], armPositions[i+1][1]);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    if (params.showDots) {
      armPositions.forEach((pos, i) => {
        ctx.beginPath();
        ctx.arc(pos[0], pos[1], i === 0 ? 4 : 2.5, 0, Math.PI*2);
        ctx.fillStyle = i === 0 ? 'rgba(255,255,255,0.55)' : 'rgba(200,169,126,0.75)';
        ctx.fill();
      });
    }
    ctx.restore();
  }

  // ── Tip dot ───────────────────────────────────────────────────────────────
  const tipColor = params.rainbow
    ? `hsl(${hue},80%,70%)`
    : PALETTES[params.palette](t).slice(0,-1) + '1)';
  ctx.save();
  ctx.shadowColor = tipColor;
  ctx.shadowBlur  = params.glow * 2;
  ctx.beginPath();
  ctx.arc(x, y, params.lw * 2.2, 0, Math.PI*2);
  ctx.fillStyle = tipColor;
  ctx.fill();
  ctx.restore();

  // ── Burst ─────────────────────────────────────────────────────────────────
  if (burstActive) {
    for (let b = 0; b < 5; b++) {
      const ba = Math.random() * Math.PI * 2;
      const br = Math.random() * 35 * (burstT / 120);
      ctx.beginPath();
      ctx.arc(x + Math.cos(ba)*br, y + Math.sin(ba)*br, 1.5, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${Math.random()*360},90%,70%,${0.85 - burstT/120})`;
      ctx.fill();
    }
  }

  // ── Stats ─────────────────────────────────────────────────────────────────
  document.getElementById('s-pts').textContent  = trail.length;
  document.getElementById('s-rev').textContent  = Math.abs(revolutions);
  document.getElementById('s-fps').textContent  = fps;
  const rv = params.ratio;
  document.getElementById('s-ratio').textContent =
    Math.abs(rv - Math.PI)         < 0.001 ? 'π'  :
    Math.abs(rv - 1.6180339887)    < 0.001 ? 'φ'  :
    Math.abs(rv - Math.E)          < 0.001 ? 'e'  : rv.toFixed(3);
}

// ── Smooth trail using quadratic bezier midpoints ─────────────────────────────
function drawTrail(pts, baseAlpha, isGhost) {
  if (pts.length < 3) return;
  ctx.save();

  ctx.lineWidth   = params.lw;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  if (params.glow > 0) {
    const gc = params.rainbow
      ? `hsl(${hue},80%,70%)`
      : PALETTES[params.palette](t).slice(0,-1) + '1)';
    ctx.shadowBlur  = params.glow;
    ctx.shadowColor = gc;
  }

  // Build one smooth continuous path segmented by colour bands
  // We use mid-point beziers for smoothness, grouped into colour chunks
  const CHUNK = 40; // re-colour every N points for perf

  for (let start = 1; start < pts.length - 1; start += CHUNK) {
    const end = Math.min(start + CHUNK, pts.length - 1);

    // Determine colour + alpha at midpoint of chunk
    const mid   = Math.floor((start + end) / 2);
    const age   = mid / pts.length;
    const alpha = baseAlpha * age * (isGhost ? 0.25 : 1);

    let strokeColor;
    if (params.rainbow) {
      strokeColor = `hsla(${pts[mid].hue},80%,68%,${alpha})`;
    } else {
      strokeColor = PALETTES[params.palette](pts[mid].t) + alpha + ')';
    }

    ctx.beginPath();
    ctx.strokeStyle = strokeColor;

    // Move to first point of chunk
    ctx.moveTo(pts[start - 1].x, pts[start - 1].y);

    // Quadratic bezier through mid-points for smooth curve
    for (let i = start; i < end; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.stroke();
  }

  ctx.restore();
}

// ── Zoom ──────────────────────────────────────────────────────────────────────
function setZoom(z) {
  zoom = Math.max(0.2, Math.min(4, z));
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
  trail = []; ghostFrames = [];
  ctx.fillStyle = '#070709';
  ctx.fillRect(0, 0, CW, CH);
}

document.getElementById('btn-zoom-in').addEventListener('click',    () => setZoom(zoom * 1.25));
document.getElementById('btn-zoom-out').addEventListener('click',   () => setZoom(zoom / 1.25));
document.getElementById('btn-zoom-reset').addEventListener('click', () => setZoom(1));

// Mouse wheel zoom on canvas
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.1 : 0.9));
}, { passive: false });

// ── Slider bindings ───────────────────────────────────────────────────────────
function bind(id, key, displayId, fmt) {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    params[key] = parseFloat(el.value);
    document.getElementById(displayId).textContent = fmt ? fmt(params[key]) : params[key];
  });
}

bind('r-arms',  'arms',     'v-arms');
bind('r-speed', 'speed',    'v-speed', v => v.toFixed(1));
bind('r-ratio', 'ratio',    'v-ratio', v =>
  Math.abs(v-Math.PI)<0.005 ? 'π' : Math.abs(v-1.618033)<0.005 ? 'φ' : Math.abs(v-Math.E)<0.005 ? 'e' : v.toFixed(4));
bind('r-phase', 'phase',    'v-phase', v => v + '°');
bind('r-scale', 'scale',    'v-scale', v => v.toFixed(2));
bind('r-trail', 'trailLen', 'v-trail');
bind('r-fade',  'fade',     'v-fade',  v => v.toFixed(3));
bind('r-lw',    'lw',       'v-lw',    v => v.toFixed(1));
bind('r-alpha', 'alpha',    'v-alpha', v => v.toFixed(2));
bind('r-glow',  'glow',     'v-glow');

// ── Toggle buttons ────────────────────────────────────────────────────────────
function toggleBtn(id, key, label) {
  document.getElementById(id).addEventListener('click', () => {
    params[key] = !params[key];
    document.getElementById(id).classList.toggle('active', params[key]);
    showToast(label + (params[key] ? ' ON' : ' OFF'));
  });
}
toggleBtn('btn-arms',    'showArms', 'Show Arms');
toggleBtn('btn-dots',    'showDots', 'Show Dots');
toggleBtn('btn-rainbow', 'rainbow',  'Rainbow');
toggleBtn('btn-mirror',  'mirror',   'Mirror');
toggleBtn('btn-ghost',   'ghost',    'Ghost Trail');

// ── Colour swatches ───────────────────────────────────────────────────────────
document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    params.palette = parseInt(sw.dataset.palette);
    trail = [];
  });
});

// ── Presets ───────────────────────────────────────────────────────────────────
const PRESETS = {
  pi:    { ratio: Math.PI,           arms: 3, speed: 1.0, scale: 0.85, palette: 0 },
  phi:   { ratio: 1.6180339887,      arms: 4, speed: 0.7, scale: 0.88, palette: 4 },
  e:     { ratio: Math.E,            arms: 3, speed: 1.3, scale: 0.82, palette: 2 },
  chaos: { ratio: 2.71828 + 0.14159, arms: 6, speed: 1.8, scale: 0.92, palette: 3 },
};

document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => {
    const p  = PRESETS[btn.dataset.preset];
    Object.assign(params, p);
    document.getElementById('r-ratio').value   = params.ratio;
    document.getElementById('v-ratio').textContent =
      btn.dataset.preset === 'pi' ? 'π' : btn.dataset.preset === 'phi' ? 'φ' :
      btn.dataset.preset === 'e'  ? 'e' : params.ratio.toFixed(4);
    document.getElementById('r-arms').value    = params.arms;
    document.getElementById('v-arms').textContent = params.arms;
    document.getElementById('r-speed').value   = params.speed;
    document.getElementById('v-speed').textContent = params.speed.toFixed(1);
    document.getElementById('r-scale').value   = params.scale;
    document.getElementById('v-scale').textContent = params.scale.toFixed(2);
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.swatch')[params.palette].classList.add('active');
    trail = []; ghostFrames = [];
    showToast('Preset: ' + btn.dataset.preset.toUpperCase());
  });
});

// ── Pause / Clear / Burst / Save ──────────────────────────────────────────────
document.getElementById('btn-pause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause';
  document.getElementById('btn-pause').classList.toggle('active', paused);
});

document.getElementById('btn-clear').addEventListener('click', () => {
  trail = []; ghostFrames = [];
  ctx.fillStyle = '#070709';
  ctx.fillRect(0, 0, CW, CH);
  showToast('Trail Cleared');
});

document.getElementById('btn-burst').addEventListener('click', () => {
  burstActive = true; burstT = 0;
  showToast('💥 BURST!');
});

document.getElementById('btn-save').addEventListener('click', () => {
  // Render at full physical res
  const link = document.createElement('a');
  link.download = `pendulum-pi-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('Image Saved!');
});

// ── Panel toggle ──────────────────────────────────────────────────────────────
document.getElementById('toggle-panel').addEventListener('click', () => {
  const panel = document.getElementById('panel');
  const hidden = panel.style.display === 'none';
  panel.style.display = hidden ? '' : 'none';
  resize();
});

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = '0', 1600);
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
